<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sýnthesi Alpha</title>
<style>
  html,body { margin:0; background:#fff; height:100%; overflow:hidden;
              font-family:Consolas,ui-monospace,monospace; color:#111; }
  /* the picture — the workshop's view 1 */
  /* the stage: a box of the form's own shape, set by the page to fit the window; bars around it */
  #v1 { position:fixed; overflow:hidden; display:none; background:#fff; }
  body.stage { background:#000; touch-action:none; user-select:none; -webkit-user-select:none;
               -webkit-touch-callout:none; }
  /* without a keyboard: one button on the resting picture; a bar that fills while a press is held */
  #touchGo { position:fixed; left:50%; bottom:9%; transform:translateX(-50%); z-index:8; display:none;
             font:inherit; font-size:30px; padding:20px 64px; border:1px solid #111; background:#fff;
             color:#111; border-radius:8px; }
  #hold { position:fixed; left:50%; bottom:9%; transform:translateX(-50%); z-index:8; display:none;
          width:min(60vw,420px); height:44px; border:1px solid #111; border-radius:8px; overflow:hidden;
          background:rgba(255,255,255,.94); pointer-events:none; }
  #hold.on { display:block; }
  #hold i { position:absolute; left:0; top:0; bottom:0; width:0; background:#111; }
  #hold.on i { animation:holdfill 2s linear forwards; }
  @keyframes holdfill { to { width:100%; } }
  #hold span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
               font-size:15px; color:#fff; mix-blend-mode:difference; }
  #v1 .strip { position:absolute; top:0; left:0; transform-origin:0 0; }
  .lens { position:absolute; top:0; pointer-events:none; }
  #over { position:absolute; inset:0; pointer-events:none; z-index:6; }
  #hud { position:fixed; left:12px; bottom:10px; z-index:8; display:none; font-size:12px; line-height:1.6;
         color:#555; background:rgba(255,255,255,.92); border:1px solid #ddd; border-radius:6px;
         padding:8px 12px; white-space:pre; pointer-events:none; }
  /* the shelf */
  #start { position:fixed; inset:0; background:#fff; display:flex;
           flex-direction:column; gap:14px; align-items:center;
           justify-content:center; z-index:9; padding:20px; box-sizing:border-box; }
  #title { font-size:20px; }
  #sub, #keys { color:#777; font-size:13px; }
  #shelfbox { max-height:50vh; max-width:100%; overflow:auto; border:1px solid #ddd;
              border-radius:6px; }
  table { border-collapse:collapse; font-size:14px; white-space:nowrap; }
  th { text-align:left; font-weight:normal; color:#777; font-size:12px;
       padding:8px 14px 6px; border-bottom:1px solid #ddd; position:sticky;
       top:0; background:#fff; }
  td { padding:9px 14px; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#f3f3f3; }
  tbody tr.on { background:#111; color:#fff; }
  #lst { font-size:13px; color:#555; min-height:1.3em; }
  #begins { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  #begins button { font:inherit; font-size:18px; padding:12px 26px; border:1px solid #111;
        background:#fff; border-radius:6px; cursor:pointer; color:#111; }
  #begins button:disabled { border-color:#ccc; color:#bbb; cursor:default; }
  #net { color:#777; font-size:12px; }
</style>

<div id="v1"><div class="strip" id="strip1"></div><div id="over"></div></div>
<div id="hud"></div>
<button id="touchGo">GO</button>
<div id="hold"><i></i><span>hold to stop</span></div>
<div id="start">
  <div id="title">S&yacute;nthesi Alpha</div>
  <div id="sub">the shelf &mdash; the kept versions</div>
  <div id="shelfbox">
    <table>
      <thead><tr><th>version</th><th>what it is</th><th>seed</th><th>length</th>
                 <th>made</th><th>sound</th><th>verdict</th><th>made by</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="lst">loading&hellip;</div>
  <div id="begins">
    <button id="go" disabled>begin &mdash; sound and picture</button>
    <button id="goScreen" disabled>begin &mdash; picture only</button>
  </div>
  <div id="keys">then ENTER plays it from the top &middot; ESCAPE stops &mdash; on every machine<br>
    on a touch screen: [GO] &middot; press and hold two seconds to stop</div>
  <div id="net">&hellip;</div>
</div>

<script src="../picture/score-data.js"></script>
<script src="../engine/score-anim.js"></script>
<script type="module" src="player.js"></script>
